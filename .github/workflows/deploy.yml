name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build must never reach production, because "production" here is
      # a privacy guarantee and not just a website.
      - run: npm run build

      - run: npx vitest run

      # Guard the guarantee in CI: if someone deletes connect-src 'none' from the
      # headers file, the deploy fails rather than quietly shipping a viewer that
      # can upload people's mail.
      - name: Assert the privacy policy is intact
        run: |
          grep -q "connect-src 'none'" dist/_headers || {
            echo "::error::connect-src 'none' is missing from dist/_headers."
            echo "This is the directive that makes the local-only guarantee true. Refusing to deploy."
            exit 1
          }
          grep -q "form-action 'none'" dist/_headers || {
            echo "::error::form-action 'none' is missing from dist/_headers. Refusing to deploy."
            exit 1
          }

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
